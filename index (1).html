

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palha Mia - Calculadora Financeira</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN para o Gráfico de Pizza -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonte Google: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fff5f7;
        }
        .bg-soft-pink { background-color: #ffeef2; }
        .bg-pink-accent { background-color: #ffc2d1; }
        .bg-pink-button { background-color: #ff8ba7; }
        .bg-pink-button:hover { background-color: #ff7597; }
        .text-pink-primary { color: #e65c83; }
        .text-pink-dark { color: #b3395b; }
        .border-pink-soft { border-color: #ffccd5; }
        
        /* Estilização dos Inputs */
        input:focus, select:focus {
            outline: none;
            border-color: #ff8ba7 !important;
            box-shadow: 0 0 0 3px rgba(255, 139, 167, 0.25) !important;
        }
        
        /* Sombra Suave */
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(255, 182, 193, 0.3), 0 8px 10px -6px rgba(255, 182, 193, 0.2);
        }
    </style>
</head>
<body class="min-h-screen text-gray-700 pb-12">

    <!-- Cabeçalho -->
    <header class="bg-white border-b border-pink-soft py-6 mb-8 card-shadow">
        <div class="max-w-4xl mx-auto px-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-soft-pink rounded-full flex items-center justify-center border-2 border-pink-accent">
                    <i class="fa-solid fa-cat text-pink-primary text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-pink-primary tracking-wide">Palha Mia</h1>
                    <p class="text-xs text-gray-500 font-medium">Controle Financeiro</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            
            <div class="bg-white p-6 rounded-2xl card-shadow border border-pink-soft">
                <h2 class="text-lg font-semibold text-pink-dark mb-4 flex items-center">
                    <i class="fa-solid fa-pen-to-square mr-2 text-pink-primary"></i> Lançar Valores
                </h2>
                
                <form id="finance-form" onsubmit="calcularFinancas(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Vendas / Faturamento (R$)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">R$</span>
                            <input type="number" step="0.01" id="receitas" placeholder="0,00" required
                                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-pink-soft bg-soft-pink/30 focus:bg-white transition-all text-gray-800 font-medium">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Ingredientes & Embalagens (R$)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">R$</span>
                            <input type="number" step="0.01" id="custos-ingredientes" placeholder="0,00" required
                                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-pink-soft bg-soft-pink/30 focus:bg-white transition-all text-gray-800 font-medium">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Outras Despesas (Gás, Energia...) (R$)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">R$</span>
                            <input type="number" step="0.01" id="custos-outros" placeholder="0,00" value="0"
                                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-pink-soft bg-soft-pink/30 focus:bg-white transition-all text-gray-800 font-medium">
                        </div>
                    </div>

                    <button type="submit" 
                        class="w-full bg-pink-button text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all duration-200 transform active:scale-95 flex items-center justify-center space-x-2 mt-6">
                        <i class="fa-solid fa-chart-pie"></i>
                        <span>Calcular Resultados</span>
                    </button>
                </form>
            </div>

          
            <div class="bg-white p-6 rounded-2xl card-shadow border border-pink-soft flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold text-pink-dark mb-4 flex items-center">
                        <i class="fa-solid fa-chart-line mr-2 text-pink-primary"></i> Resumo Financeiro
                    </h2>

                
                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <div class="bg-soft-pink p-3 rounded-xl border border-pink-soft">
                            <span class="text-xs text-gray-500 font-medium block">Faturamento</span>
                            <span id="res-faturamento" class="text-lg font-bold text-gray-800">R$ 0,00</span>
                        </div>
                        <div class="bg-soft-pink p-3 rounded-xl border border-pink-soft">
                            <span class="text-xs text-gray-500 font-medium block">Total Custos</span>
                            <span id="res-custos" class="text-lg font-bold text-pink-primary">R$ 0,00</span>
                        </div>
                        <div class="bg-soft-pink p-3 rounded-xl border border-pink-soft">
                            <span class="text-xs text-gray-500 font-medium block">Lucro Líquido</span>
                            <span id="res-lucro" class="text-lg font-bold text-emerald-600">R$ 0,00</span>
                        </div>
                        <div class="bg-soft-pink p-3 rounded-xl border border-pink-soft">
                            <span class="text-xs text-gray-500 font-medium block">Margem de Lucro</span>
                            <span id="res-margem" class="text-lg font-bold text-pink-dark">0%</span>
                        </div>
                    </div>
                </div>

               
                <div class="relative flex items-center justify-center h-48 w-full mt-2">
                    <canvas id="meuGrafico"></canvas>
                </div>
            </div>

        </div>
    </main>

   
    <script>
        let meugraficoInstance = null;

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function calcularFinancas(event) {
            event.preventDefault();

            const receita = parseFloat(document.getElementById('receitas').value) || 0;
            const ingredientes = parseFloat(document.getElementById('custos-ingredientes').value) || 0;
            const outrosCustos = parseFloat(document.getElementById('custos-outros').value) || 0;

            
            const totalCustos = ingredientes + outrosCustos;
            const lucro = receita - totalCustos;
            const margem = receita > 0 ? ((lucro / receita) * 100).toFixed(1) : 0;

     
            document.getElementById('res-faturamento').textContent = formatarMoeda(receita);
            document.getElementById('res-custos').textContent = formatarMoeda(totalCustos);
            document.getElementById('res-lucro').textContent = formatarMoeda(lucro);
            document.getElementById('res-margem').textContent = margem + '%';

          
            desenharGrafico(ingredientes, outrosCustos, lucro > 0 ? lucro : 0);
        }

        function desenharGrafico(ingredientes, outros, lucro) {
            const ctx = document.getElementById('meuGrafico').getContext('2d');

          
            if (meugraficoInstance) {
                meugraficoInstance.destroy();
            }

            meugraficoInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Ingredientes & Embalagens', 'Outras Despesas', 'Lucro Líquido'],
                    datasets: [{
                        data: [ingredientes, outros, lucro],
                        backgroundColor: [
                            '#ffb3c1', // Rosa Suave para Ingredientes
                            '#ff8ba7', // Rosa Principal para Outros Custos
                            '#a3e635'  // Verde Limão Suave para Lucro
                        ],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: {
                                    family: 'Poppins',
                                    size: 11
                                },
                                boxWidth: 12
                            }
                        }
                    }
                }
            });
        }

     
        window.onload = function() {
            desenharGrafico(1, 1, 1);
        };
    </script>
</body>
</html>

```
